# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
---
modules:
  - type: os-release
    properties:
      ID: kierownik
      ID_LIKE: fedora
      NAME: Kierownik
      PRETTY_NAME: Kierownik
      DEFAULT_HOSTNAME: kierownik
      HOME_URL: https://github.com/lgranie/kierownik
      DOCUMENTATION_URL: https://github.com/lgranie/kierownik
      BUG_REPORT_URL: https://github.com/lgranie/kierownik/issues

  - type: script
    scripts:
      - finalize/clean.sh
      - finalize/removesuid.sh
...
