---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: krw-8745
# description will be included in the image's metadata
description: This is my personal OS image. Hyprland on a Chuwi AuBox 8745

# the base image to build on top of (FROM) and the version tag to use
base-image: quay.io/fedora/fedora-bootc
image-version: 44

platforms:
  - linux/amd64

# Compile the machine-tuned kernel in a builder stage and package it into a
# kernel-kierownik RPM. Shared logic: files/scripts/kernel/build-kernel-rpm.sh
stages:
  - name: kernel-builder
    from: quay.io/fedora/fedora:44
    modules:
      - type: containerfile
        snippets:
          - "COPY kernels/8745.config /tmp/kernelsrc/kernel.config"
      - type: script
        snippets:
          - "/tmp/files/scripts/kernel/build-kernel-rpm.sh"

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - from-file: base/all.yml
  - from-file: cpu/amd.yml

  - from-file: kernel/install.yml

  - from-file: wm/common.yml
  - from-file: wm/8745.yml

  - from-file: llm/ollama.yml
  - from-file: llm/pi_less_yolo.yml

  - from-file: finalize/all.yml
...
