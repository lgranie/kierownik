# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
---
modules:
  - type: dnf
    remove:
      auto-remove: true
      packages:
        - intel-gpu-firmware

  - type: files
    files:
      - source: cpu/amd
        destination: /

  - type: kargs
    arch: x86_64
    kargs:
      - amd_pstate=active
      # Pin THP to madvise: llama.cpp marks its buffers MADV_HUGEPAGE, so it
      # gets hugepages with zero boot-time RAM reservation. Slightly faster
      # than always for llama.cpp CPU inference (Phoronix, Linux 6.18 LTS).
      - transparent_hugepage=madvise

  - from-file: cpu/common/realtime.yml
  - from-file: cpu/common/hardening.yml
...
