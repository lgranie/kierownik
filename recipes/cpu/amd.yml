---
modules:
  - type: dnf
    remove:
      auto-remove: true
      packages:
        - intel-gpu-firmware

  - type: files
    files:
      - source: cpu/amd
        destination: /

  - type: kargs
    arch: x86_64
    kargs:
      - amd_iommu=on
      - amd_pstate=epp

  - from-file: cpu/common/realtime.yml
  - from-file: cpu/common/hardening.yml
...
