# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
---
modules:
  - type: dnf
    remove:
      auto-remove: true
      packages:
        - intel-gpu-firmware

  - type: files
    files:
      - source: cpu/amd
        destination: /

  - type: kargs
    arch: x86_64
    kargs:
      - amd_pstate=active

  - from-file: cpu/common/realtime.yml
  - from-file: cpu/common/hardening.yml
...
