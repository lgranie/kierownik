---
modules:
  - type: github-releases
    source: local
    releases:
      - repo: peteonrails/voxtype
        asset: voxtype-{tag}-linux-x86_64-vulkan
        dest: /usr/bin/voxtype
        fetch:
          - url: https://raw.githubusercontent.com/peteonrails/voxtype/main/packaging/completions/voxtype.bash
            dest: /usr/share/bash-completion/completions/voxtype

  - type: noctalia
    source: local
    plugins:
      - gabedunn/voxtype

  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - ydotool

  - type: files
    files:
      - source: wm/common/voxtype
        destination: /

  - type: systemd
    system:
      masked:
        - voxtype.service
...
