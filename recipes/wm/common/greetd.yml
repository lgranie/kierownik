---
modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - greetd
        - greetd-selinux

  - type: dnf
    repos:
      cleanup: true
      copr:
        - lionheartp/Hyprland
    install:
      install-weak-deps: false
      packages:
        - noctalia-greeter

  - type: files
    files:
      - source: wm/common/greetd
        destination: /

  - type: systemd
    system:
      enabled:
        - greetd
...
