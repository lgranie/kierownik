---
modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - noctalia

  - type: script
    snippets:
      - "desktop-file-edit --set-key=NoDisplay --set-value=true /usr/share/applications/dev.noctalia.Noctalia.desktop"

  - type: noctalia
    source: local
    plugins:
      - kierownik/nightlight
      - kierownik/bookmarks
      - noctalia/wallhaven
    builtin_templates:
      - gtk3
      - gtk4
      - qt
    templates:
      - opencode

  - type: files
    files:
      - source: wm/common/noctalia
        destination: /

  - type: systemd
    user:
      enabled:
        - noctalia.service
...
