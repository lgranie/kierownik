---
modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - noctalia

  - type: script
    snippets:
      - "desktop-file-edit --set-key=NoDisplay --set-value=true /usr/share/applications/dev.noctalia.Noctalia.desktop"
      - "/tmp/files/scripts/common/enable-noctalia-plugin kierownik/nightlight"
      - "/tmp/files/scripts/common/enable-noctalia-plugin linkding/bookmarks"
      - "/tmp/files/scripts/common/enable-noctalia-plugin noctalia/wallhaven"

  - type: files
    files:
      - source: wm/common/noctalia
        destination: /

  - type: systemd
    user:
      enabled:
        - noctalia.service
...
