---
modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - dbus-broker
        # Fedora 45 default Secret Service provider (replaces gnome-keyring).
        # oo7-daemon ships oo7-daemon.service + D-Bus activation
        # (dbus-org.freedesktop.secrets.service, no socket unit);
        # oo7-portal is the xdg-desktop-portal Secret backend.
        - oo7-daemon
        - oo7-portal
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk
        - xdg-utils

  - type: systemd
    user:
      enabled:
        - dbus-broker
        - oo7-daemon
    system:
      masked:
        - geoclue.service
...
