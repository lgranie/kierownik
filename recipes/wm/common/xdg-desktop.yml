---
modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - dbus-broker
        - desktop-file-utils
        # Fedora 45 default Secret Service provider (replaces gnome-keyring).
        # oo7-daemon ships oo7-daemon.service + D-Bus activation
        # (dbus-org.freedesktop.secrets.service, no socket unit);
        # oo7-portal is the xdg-desktop-portal Secret backend.
        # pam_oo7 is the PAM module greetd's stack expects; without it the
        # login keyring stays locked and libsecret clients block on it.
        - oo7-daemon
        - oo7-portal
        - pam_oo7
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk
        - xdg-utils

  - type: systemd
    user:
      enabled:
        - dbus-broker
        - oo7-daemon
    system:
      masked:
        - geoclue.service

  - type: script
    snippets:
      - |
        desktop-file-edit --set-key=NoDisplay --set-value=true /usr/share/applications/btop.desktop
        desktop-file-edit --set-key=NoDisplay --set-value=true /usr/share/applications/nvtop.desktop
...
