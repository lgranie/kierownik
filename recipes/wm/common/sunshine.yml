---
modules:
  - type: dnf
    repos:
      cleanup: true
      copr:
        - lizardbyte/stable
    install:
      install-weak-deps: false
      packages:
        # Pinned to 2026.516: .906/.907 break wlr dmabuf capture on Mesa 26 (black screen).
        # Revert to `- Sunshine` once upstream fixes capture.
        - https://github.com/LizardByte/Sunshine/releases/download/v2026.516.143833/Sunshine-2026.516.143833-1.fc44.x86_64.rpm

  # - type: dnf
  #  install:
  #    packages:
  #      - https://download.copr.fedorainfracloud.org/results/lizardbyte/beta/fedora-44-x86_64/10581589-Sunshine/Sunshine-2026.608.233907-1.fc44.x86_64.rpm

  - type: files
    files:
      - source: wm/common/sunshine
        destination: /

  - type: script
    snippets:
      - "setcap \"cap_sys_nice=ep\" \"/usr/bin/sunshine\""
      - "firewall-offline-cmd --zone=Kierownik --add-service=sunshine"

  - type: systemd
    user:
      enabled:
        - sunshine.service

  - type: script
    snippets:
      - "desktop-file-edit --set-key=NoDisplay --set-value=true /usr/share/applications/dev.lizardbyte.app.Sunshine.desktop"
      - "desktop-file-edit --set-key=NoDisplay --set-value=true /usr/share/applications/dev.lizardbyte.app.Sunshine.kwin.desktop"
      - "desktop-file-edit --set-key=NoDisplay --set-value=true /usr/share/applications/dev.lizardbyte.app.Sunshine.terminal.desktop"
...
