---
modules:
  - type: dnf
    repos:
      cleanup: true
      copr:
        - lizardbyte/stable
    install:
      install-weak-deps: false
      packages:
        - Sunshine

  - type: files
    files:
      - source: wm/common/sunshine
        destination: /

  - type: script
    snippets:
      - "setcap \"cap_sys_nice=ep\" \"/usr/bin/sunshine\""
      - "firewall-offline-cmd --zone=Kierownik --add-service=sunshine"

  - type: systemd
    user:
      enabled:
        - sunshine.service

  - type: script
    snippets:
      - "desktop-file-edit --set-key=NoDisplay --set-value=true /usr/share/applications/dev.lizardbyte.app.Sunshine.desktop"
      - "desktop-file-edit --set-key=NoDisplay --set-value=true /usr/share/applications/dev.lizardbyte.app.Sunshine.kwin.desktop"
      - "desktop-file-edit --set-key=NoDisplay --set-value=true /usr/share/applications/dev.lizardbyte.app.Sunshine.terminal.desktop"
...
