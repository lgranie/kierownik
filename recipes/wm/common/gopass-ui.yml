---
modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - pass
        - pass-otp
        # qtpass is a Qt6 build; without this plugin Qt falls through
        # QT_QPA_PLATFORM's ";xcb" fallback to XWayland.
        - qt6-qtwayland
        - qtpass
        - wtype

  - type: script
    snippets:
      - "/tmp/files/scripts/common/enable-noctalia-plugin mellotanica/launcher-pass"

...
