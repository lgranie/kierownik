---
modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - iio-sensor-proxy
        - evtest

  - from-file: wm/video/negativo17/intel.yml
  - from-file: wm/common/wvkbd.yml

  - type: files
    files:
      - source: wm/5290
        destination: /

  - type: script
    snippets:
      - "chmod +x /usr/bin/krw-autorotate /usr/bin/krw-tablet-mode"

  - type: systemd
    system:
      enabled:
        - iio-sensor-proxy.service
    user:
      enabled:
        - krw-autorotate.service
        - krw-tablet-mode.service
...
