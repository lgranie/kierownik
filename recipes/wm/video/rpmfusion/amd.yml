# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
---
modules:
  - from-file: wm/video/rpmfusion/common.yml

  - type: dnf
    repos:
      cleanup: true
      nonfree: rpmfusion
    install:
      install-weak-deps: false
      packages:
        - repo: rpmfusion-free
          packages:
            - mesa-va-drivers-freeworld
            - mesa-vulkan-drivers-freeworld
        - vulkan-tools
    replace:
      - from-repo: rpmfusion-free
        allow-erasing: true
        install-weak-deps: false
        packages:
          - old: mesa-vulkan-drivers
            new: mesa-vulkan-drivers-freeworld
...
