# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
---
modules:
  - type: dnf
    repos:
      cleanup: true
      nonfree: rpmfusion
    install:
      install-weak-deps: false
      packages:
        - libopenjph
        - libva-utils
        - openh264
        - gstreamer1-plugin-openh264
        - mozilla-openh264
        - gstreamer1-plugins-bad-freeworld
        - gstreamer1-plugins-ugly
        - libheif-freeworld

    replace:
      - from-repo: rpmfusion-free
        allow-erasing: true
        skip-unavailable: true
        packages:
          - old: ffmpeg-free
            new: ffmpeg
          - old: fdk-aac-free
            new: fdk-aac
          - old: gstreamer1-plugins-ugly-free
            new: gstreamer1-plugins-ugly
          - old: libavcodec-free
            new: libavcodec
          - old: libavdevice-free
            new: libavdevice
          - old: libavfilter-free
            new: libavfilter
          - old: libavformat-free
            new: libavformat
          - old: libavutil-free
            new: libavutil
          - old: libpostproc-free
            new: libpostproc
          - old: libswresample-free
            new: libswresample
          - old: libswscale-free
            new: libswscale
...
