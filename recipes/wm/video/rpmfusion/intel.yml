# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
---
modules:
  - from-file: wm/video/rpmfusion/common.yml

  - type: dnf
    repos:
      cleanup: true
      nonfree: rpmfusion
    install:
      install-weak-deps: false
      packages:
        - repo: rpmfusion-nonfree
          packages:
            - intel-media-driver
        - intel-gmmlib
        - intel-mediasdk
        - libvpl
    replace:
      - from-repo: rpmfusion-nonfree
        allow-erasing: true
        skip-unavailable: true
        packages:
          - old: libva-intel-media-driver
            new: intel-media-driver
...
