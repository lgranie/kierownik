# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: krw-x4cxl
# description will be included in the image's metadata
description: This is my personal OS image. Topton X4C-XL Headless Server

# the base image to build on top of (FROM) and the version tag to use
base-image: quay.io/fedora/fedora-bootc
image-version: 44

platforms:
  - linux/amd64

# Compile the machine-tuned kernel in a builder stage and package it into a
# kernel-kierownik RPM. Shared logic: files/scripts/kernel/build-kernel-rpm.sh
stages:
  - name: kernel-builder
    from: quay.io/fedora/fedora:44
    modules:
      - type: containerfile
        snippets:
          - "COPY kernels/common.config /tmp/kernelsrc/common.config"
          - "COPY kernels/common/bootc.config /tmp/kernelsrc/bootc.config"
          - "COPY kernels/common/intel.config /tmp/kernelsrc/intel.config"
          - "COPY kernels/x4cxl.config /tmp/kernelsrc/machine.config"
      - type: script
        snippets:
          - "/tmp/files/scripts/kernel/build-kernel-rpm.sh"

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - from-file: base/all.yml
  - from-file: cpu/intel.yml

  - from-file: kernel/install.yml

  # finalize
  - from-file: finalize/all.yml
...
