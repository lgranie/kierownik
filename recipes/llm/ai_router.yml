# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
---
modules:
  # No dnf packages: runs as a Podman quadlet from a locally built
  # Chainguard-based image (`mise run ai_router:build`).
  # No firewall service: bound to 127.0.0.1 only (single-user router).
  # No systemd enable here: quadlet units generate at runtime, so the
  # on-demand socket is enabled on first `mise run ai_router:init`.
  - type: files
    files:
      - source: llm/ai_router
        destination: /

  - type: systemd
    user:
      enabled:
        - ai_router-proxy.socket

  - type: script
    snippets:
      - "chmod +x /usr/lib/kierownik/ai_router/wait-ready"
...
