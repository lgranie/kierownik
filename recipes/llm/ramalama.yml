# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
---
modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - nvtop
        - ramalama

  - type: files
    files:
      - source: llm/ramalama
        destination: /

  - type: kargs
    arch: x86_64
    kargs:
      # Pin THP to madvise: llama.cpp marks its buffers MADV_HUGEPAGE, so it
      # gets hugepages with zero boot-time RAM reservation. Slightly faster
      # than always for llama.cpp CPU inference (Phoronix, Linux 6.18 LTS).
      - transparent_hugepage=madvise

  - type: script
    snippets:
      - "firewall-offline-cmd --zone=Kierownik --add-service=ramalama"
...
