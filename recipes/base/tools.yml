# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
---
modules:
  - type: files
    files:
      - source: base/tools
        destination: /

  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - bat
        - bcvk
        - btop
        - delta
        - dua-cli
        - fd
        - fzf
        - gcc
        - git
        - gum
        - jq
        - lsd
        - make
        - neovim
        - nvtop
        - openssh
        - podman-tui
        - ripgrep
        - stow
        - tar
        - tmux
        - unzip
        - yq
        - zoxide
        - zstd

  - type: dnf
    repos:
      cleanup: true
      copr:
        - lihaohong/yazi
    install:
      install-weak-deps: false
      packages:
        - yazi

  - type: github-releases
    source: local
    releases:
      - repo: jdx/usage
        asset: usage-x86_64-unknown-linux-gnu.tar.gz
        dest: /usr/bin
        member: usage
        chmod: true
      - repo: herdrdev/herdr
        asset: herdr-linux-x86_64
        dest: /usr/bin/herdr
      - repo: bjarneo/cliamp
        asset: cliamp-linux-amd64
        dest: /usr/bin/cliamp
      - repo: matheus-git/systemd-manager-tui
        asset: systemd-manager-tui
        dest: /usr/bin/systemd-manager-tui
      - repo: jesseduffield/lazygit
        asset: lazygit_{tag}_linux_x86_64.tar.gz
        dest: /usr/bin
        member: lazygit
        chmod: true
      - repo: jdx/mise
        asset: mise-v{tag}-linux-x64.tar.gz
        dest: /usr/bin
        member: mise/bin/mise
        strip: 2
      - repo: HalFrgrd/flyline
        asset: libflyline-v{tag}-x86_64-unknown-linux-gnu.tar.gz
        dest: /usr/lib64
        links:
          /usr/lib64/libflyline.so: /usr/lib64/libflyline.so.{tag}

  - type: noctalia
    source: local
    builtin_templates:
      - btop
    templates:
      - bat
      - fzf
      - herdr
      - lazygit
      - yazi

  - type: script
    snippets:
      - |
        mkdir -p /usr/share/bash-completion/completions
        bat --completion bash > /usr/share/bash-completion/completions/bat
        delta --generate-completion bash > /usr/share/bash-completion/completions/delta
        dua completions bash > /usr/share/bash-completion/completions/dua
        gum completion bash > /usr/share/bash-completion/completions/gum
        herdr completion bash > /usr/share/bash-completion/completions/herdr
        lazygit completion bash > /usr/share/bash-completion/completions/lazygit
        usage --completions bash > /usr/share/bash-completion/completions/usage
        yq completion bash > /usr/share/bash-completion/completions/yq
        fzf --bash > /etc/profile.d/90-fzf.sh
        mise activate bash > /etc/profile.d/90-mise.sh
        zoxide init --cmd cd bash > /etc/profile.d/90-zoxide.sh
...
