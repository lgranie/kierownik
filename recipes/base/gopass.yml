# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
---
modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - gopass
        - gopass-jsonapi

  - type: files
    files:
      - source: base/gopass
        destination: /

  - type: script
    snippets:
      - "gopass completion bash > /usr/share/bash-completion/completions/gopass"
...
