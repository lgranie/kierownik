# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
---
modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - fido2-tools
        - gnupg2-scdaemon
        - pam-u2f
        - pamu2fcfg
        - pcsc-lite

  - type: systemd
    system:
      enabled:
        - pcscd.service
        - pcscd.socket
        - systemd-homed

  - type: script
    snippets:
      # Keep the local profile: the sssd profile puts pam_localuser (with
      # default=1) before the with-systemd-homed pam_systemd_home line, so
      # homed users -- who are not in /etc/passwd -- skip pam_systemd_home
      # during authentication. pam_unix then accepts the NSS shadow record,
      # the home is only unlocked in the account phase, and the greeter asks
      # for the password twice. The local profile keeps pam_systemd_home
      # before pam_unix, so one prompt authenticates and unlocks the home.
      - "authselect select local with-systemd-homed with-faillock without-nullok with-pam-u2f"
      - "authselect apply-changes"
      - "sed -i 's|^# minlen = 8|minlen = 6|' /etc/security/pwquality.conf"
...
