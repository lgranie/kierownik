# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
---
modules:
  - type: dnf
    remove:
      auto-remove: true
      packages:
        - cirrus-audio-firmware
        - gssproxy
        - nano
        - nfs-utils
        - nvidia-gpu-firmware
        - openssh-server
        - rpcbind
        - vim-common
        - vim-data
        - vim-minimal

  - type: script
    snippets:
      - rm -f /etc/profile.d/*csh*
...
