---
modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - syncthing

  - type: files
    files:
      - source: base/syncthing
        destination: /

  - type: systemd
    system:
      masked:
        - syncthing.service
    user:
      enabled:
        - syncthing.service

  - type: script
    snippets:
      - "echo 'NoDisplay=true' >> /usr/share/applications/syncthing-start.desktop"
...
