# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
---
modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - syncthing

  - type: files
    files:
      - source: base/syncthing
        destination: /

  - type: systemd
    system:
      masked:
        - syncthing.service
    user:
      enabled:
        - syncthing.service

  - type: script
    snippets:
      - "firewall-offline-cmd --zone=Kierownik --add-service=syncthing"
...
