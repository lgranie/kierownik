# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
---
modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - firewalld

  - type: files
    files:
      - source: base/network
        destination: /

  - type: script
    snippets:
      - "chmod 644 /etc/firewalld/zones/Kierownik.xml"
      - "sed -i 's/^DefaultZone=.*/DefaultZone=Kierownik/' /etc/firewalld/firewalld.conf"

  - type: systemd
    system:
      enabled:
        - firewalld.service

  - type: script
    snippets:
      - "mkdir -p /etc/systemd/system/basic.target.wants"
      - "ln -sf /usr/lib/systemd/system/NetworkManager.service /etc/systemd/system/basic.target.wants/NetworkManager.service"
      - "rm -f /etc/systemd/system/NetworkManager-wait-online.service"
      - "ln -sf /usr/lib/systemd/system/NetworkManager-wait-online.service /etc/systemd/system/network-online.target.wants/NetworkManager-wait-online.service"
...
