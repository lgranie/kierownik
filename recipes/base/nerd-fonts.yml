# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
---
modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - fontconfig
        # Color emoji (Noctalia emoji picker, notifications, browsers).
        # Nerd Fonts carry symbols only, no emoji coverage.
        - google-noto-color-emoji-fonts

  - type: fonts
    fonts:
      nerd-fonts:
        - JetBrainsMono
...
