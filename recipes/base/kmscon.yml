# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
---
# Fedora 45 ships kmscon as the default VT console out of the box
# (/usr/lib/systemd/system/autovt@.service -> kmsconvt@.service, with
# fallback to getty/fbcon), so we no longer manage the symlink ourselves.
# The explicit installs stay: the default only covers base kmscon, while
# our kmscon.conf needs hwaccel (kmscon-gl) and font-engine=pango
# (kmscon-pango).
modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - kmscon
        - kmscon-gl
        - kmscon-pango

  - type: files
    files:
      - source: base/kmscon
        destination: /
...
