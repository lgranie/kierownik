[tools]
"cargo:blue-build" = "latest"
cargo-binstall = "latest"
rust = "latest"
opencode = "latest"

[settings]
# windows_default_inline_shell_args = "pwsh -c"

[settings.cargo]
binstall = true
binstall_quickinstall = true

[env]
BASE_IMAGE = 'quay.io/fedora/fedora-bootc:44'
