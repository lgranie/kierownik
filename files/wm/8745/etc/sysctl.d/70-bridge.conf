# Pure L2 fast path for the br0 bridge: bridged frames skip netfilter.
# Host traffic itself (INPUT to br0's address) is still filtered by
# firewalld in the Kierownik zone; only forwarding bypasses it.
net.bridge.bridge-nf-call-iptables = 0
net.bridge.bridge-nf-call-ip6tables = 0
net.bridge.bridge-nf-call-arptables = 0
