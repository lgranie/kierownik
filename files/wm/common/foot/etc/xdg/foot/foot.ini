# Kierownik foot defaults (system-wide, all users).
# Colors intentionally absent: Noctalia manages foot colors
# dynamically via ~/.config/foot/themes/noctalia + an
# include line it injects on variant apply.

[csd]
preferred = none

[main]
font = JetBrainsMono Nerd Font:size=11
box-drawings-uses-font-glyphs = yes
pad = 0x0 center

[scrollback]
lines = 10000

[cursor]
style = beam
blink = yes

[mouse]
hide-when-typing = yes
