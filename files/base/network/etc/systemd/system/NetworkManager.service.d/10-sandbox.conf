# Additive sandbox hardening for NetworkManager (secureblue 40-sandbox.conf pattern).
# Only missing directives; stock unit already ships ProtectSystem=true,
# ProtectHome=read-only and its CapabilityBoundingSet — never restate here.
[Service]
PrivateTmp=true
ProtectProc=invisible
ProtectControlGroups=yes
ProtectKernelLogs=yes
KeyringMode=private
LockPersonality=yes
MemoryDenyWriteExecute=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
SystemCallArchitectures=native
SystemCallFilter=~@module @mount @obsolete
