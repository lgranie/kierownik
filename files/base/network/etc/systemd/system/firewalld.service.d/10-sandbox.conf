# Additive sandbox hardening for firewalld (secureblue 40-sandbox.conf pattern).
# Stock unit already ships DevicePolicy=closed, MemoryDenyWriteExecute,
# ProtectSystem=yes, RestrictRealtime/SUIDSGID, LockPersonality, ProtectClock…
# /etc must stay writable (permanent firewall config via D-Bus).
[Service]
PrivateTmp=true
ProtectProc=invisible
RestrictNamespaces=yes
SystemCallFilter=~@module @mount @obsolete @reboot
