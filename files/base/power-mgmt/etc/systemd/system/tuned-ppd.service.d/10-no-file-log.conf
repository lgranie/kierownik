# tuned-ppd.service fails to start because /var/log/tuned/tuned-ppd.log
# is labeled tuned_log_t and the tuned_ppd_t SELinux domain lacks write
# access (Fedora policy gap; EACCES even for root). Drop the -l file-log
# flag so the daemon logs to journald instead, which it can reach.
[Service]
ExecStart=
ExecStart=/usr/sbin/tuned-ppd