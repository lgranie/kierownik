# Kierownik lid policy.
# Lid on battery/AC: suspend (Noctalia locks via logind Lock signal).
# Docked or externally powered: ignore (external monitor keeps session alive).
# No suspend-then-hibernate: hibernate needs a swap partition the
# base image does not guarantee (see hibernation tasks on demand).
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
